# fly.toml — rename `app` per your Fly.io org before `fly deploy`.
# Docs: https://fly.io/docs/reference/configuration/

app = "evo-skillopt-worker"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PORT             = "9000"

[http_service]
  internal_port        = 9000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[mounts]]
  source      = "evo_data"
  destination = "/data"

[[vm]]
  memory   = "1gb"
  cpu_kind = "shared"
  cpus     = 1

[[services]]
  protocol      = "tcp"
  internal_port = 9000

  [[services.tcp_checks]]
    interval        = "15s"
    timeout         = "2s"
    grace_period    = "10s"
