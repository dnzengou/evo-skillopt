openapi: 3.1.0
info:
  title: "{{project}}"
  version: 0.1.0
  summary: "{{description}}"
  description: |
    Replace this file with the real OpenAPI 3.1 contract for your
    service. This template exists so agent runtimes find a well-formed
    spec at /.well-known/openapi.yaml during discovery.
  license:
    name: MIT
    identifier: MIT
  contact:
    url: "https://github.com/{{owner}}/{{repo}}/issues"

servers:
  - url: "http://localhost:8080"
    description: Local dev

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
