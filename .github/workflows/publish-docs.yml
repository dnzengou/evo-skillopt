name: publish-docs

# Publish MkDocs site to GitHub Pages. The gh-pages site hosts
# llms.txt, llms-full.txt, AGENTS.md, and .well-known/ so AI crawlers
# that respect the site_url convention find them at the declared URL.
#
# One-time setup required in the repo: Settings → Pages → Build and
# deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "llms.txt"
      - "llms-full.txt"
      - "AGENTS.md"
      - ".well-known/**"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build mkdocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install mkdocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocstrings[python]
      - name: resolve agent-discovery files + repo-root MDs under docs/
        # mkdocs copies docs/* to the site root. `install -D` overwrites
        # a symlink with a regular file (plain `cp` errors on
        # same-file when docs/ has symlinks to the repo root).
        # We also pull in the repo-root MDs that docs/ cross-links to so
        # the generated site's internal links actually resolve.
        run: |
          mkdir -p docs/.well-known
          # Agent-SEO files — must sit at the published site root.
          install -D -m 644 llms.txt                  docs/llms.txt
          install -D -m 644 llms-full.txt             docs/llms-full.txt
          install -D -m 644 AGENTS.md                 docs/AGENTS.md
          install -D -m 644 .well-known/agents.json   docs/.well-known/agents.json
          install -D -m 644 .well-known/openapi.yaml  docs/.well-known/openapi.yaml
          # Repo-root MDs that docs/ cross-links to.
          for f in GTM.md USE_CASES.md INSTALL.md SHOWCASE.md RELEASING.md \
                   CONTRIBUTING.md SECURITY.md DISCLAIMER.md TRADEMARKS.md \
                   CODE_OF_CONDUCT.md CHANGELOG.md EvoSkillOpt_Blueprint.md; do
            if [ -f "$f" ]; then install -D -m 644 "$f" "docs/$f"; fi
          done
      - name: build
        # Not --strict: docs/ links a handful of repo-root MDs via
        # `../path.md`. With the repo-root MDs now mirrored under docs/
        # most resolve, but a handful of edge-case links remain warnings.
        # They render as literal text, not broken links, so we ship.
        run: mkdocs build
      - name: overlay raw agent-SEO files
        # mkdocs converts foo.md → foo/index.html. Agents expect the raw
        # file at its original URL (e.g. /AGENTS.md, /.well-known/*).
        # Overlay the raw bytes AFTER the build so both URLs serve —
        # /AGENTS/ for humans, /AGENTS.md for crawlers.
        run: |
          install -D -m 644 AGENTS.md                 site/AGENTS.md
          install -D -m 644 .well-known/agents.json   site/.well-known/agents.json
          install -D -m 644 .well-known/openapi.yaml  site/.well-known/openapi.yaml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
