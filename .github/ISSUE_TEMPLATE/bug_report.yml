name: Bug report
description: Report something that's broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please include a minimal repro and
        the versions of Python and evo-skillopt you're on. Do **not**
        paste API keys or customer data.

  - type: input
    id: version
    attributes:
      label: evo-skillopt version / commit
      placeholder: "git rev-parse HEAD or pip show evo-skillopt"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - pipx
        - "pip install -e ."
        - Docker (single container)
        - Docker Compose
        - Fly.io
        - systemd
        - Kubernetes
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: "Smallest input that triggers the problem. Include the exact `curl` or payload if HTTP-related."
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: "Include stderr / stack trace / HTTP response body."
      render: shell
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: "OS, Python version, LLM provider you're calling, container or bare-metal."
    validations:
      required: false
