site_name: evo-skillopt
site_url: https://dnzengou.github.io/evo-skillopt
site_description: "Text-space skill optimization for production LLM agents, callable over HTTP. Train a Markdown skill file like a neural network — epochs, batches, validation gates — without touching model weights."
site_author: "evo-skillopt contributors"
repo_url: https://github.com/dnzengou/evo-skillopt
repo_name: dnzengou/evo-skillopt
edit_uri: edit/main/docs/

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dnzengou/evo-skillopt
      name: evo-skillopt on GitHub
  tags:
    LLM: llm
    Agent: agent
    SkillOpt: skillopt
    RRSS: rrss
    Cascade: cascade
    ARM: arm
  # OpenGraph preview — social-crawler fallback. Resolves at /assets/og.svg
  # on the published site. Material also exposes site_url for og:url.
  og_image: assets/og.svg
  og_image_type: image/svg+xml

extra_css:
  - stylesheets/extra.css

# Agent-crawl aids served from the docs site root.
# Place matching copies in docs/ (sibling to index.md) and mkdocs will
# publish them at /llms.txt, /llms-full.txt, /.well-known/agents.json,
# /AGENTS.md so LLM crawlers and the llms.txt convention can locate them.

theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    # Respect the viewer's system preference by default; the toggle buttons
    # below let them override. `media` queries work on all modern browsers.
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - search.suggest
    - search.highlight
    - search.share
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - evo-skillopt:
    - Concept: CONCEPT.md
    - Glossary: GLOSSARY.md
    - AI-era SEO notes: AI_SEO.md
  - Getting Started (upstream SkillOpt reference):
    - Installation: guide/installation.md
    - First Experiment: guide/first-experiment.md
    - Configuration: guide/configuration.md
  - Core Concepts (upstream SkillOpt reference):
    - Training Loop: guide/training-loop.md
    - Skill Document: guide/skill-document.md
    - Deep Learning Analogy: guide/dl-analogy.md
  - Extension Guides (upstream SkillOpt reference):
    - Add a New Benchmark: guide/new-benchmark.md
    - Local Environment Smoke Tests: guide/local-env-smoke.md
    - Add a New Model Backend: guide/new-backend.md
  - Reference (upstream SkillOpt reference):
    - Configuration Reference: reference/config.md
    - CLI Reference: reference/cli.md
    - API Reference: reference/api.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
