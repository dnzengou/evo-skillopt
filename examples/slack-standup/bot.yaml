# Slack Standup Bot — example evo-skillopt bot manifest

name: slack-standup
version: 0.1.0
license: MIT
description: |
  Async daily standups in Slack. DMs each team member 3 questions,
  compiles a channel-friendly digest, follows up on blockers.

tags: [slack, standup, async]

channels: [slack]

llm:
  provider: any

skill: skills/main.md

evolution:
  enabled: true
  cadence: weekly
  gate_min_improvement: 0.05
  num_epochs: 3
  eval_split_dir: eval/
