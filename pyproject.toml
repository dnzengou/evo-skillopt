[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-skillopt"
version = "0.1.0"
description = "Text-space skill optimization for production LLM agents, callable over HTTP."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "evo-skillopt contributors"},
]
keywords = ["agent", "prompt-optimization", "skill-learning", "LLM", "agentic", "skillopt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Vendored SkillOpt core deps
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "azure-identity>=1.15.0",
    "azure-core>=1.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# HTTP worker extras (metrics, structured logs)
worker = [
    "prometheus-client>=0.20.0",
]
# Optional LLM backends
claude = ["anthropic>=0.30.0"]
gemini = ["google-genai>=0.3.0"]
# Benchmark-specific
alfworld = ["alfworld>=0.4.0", "gymnasium>=0.29.0"]
# Local model backend via vLLM
qwen = ["vllm>=0.4.0"]
# Documentation site
docs = ["mkdocs-material>=9.5.0", "mkdocstrings[python]>=0.24.0"]
# WebUI dashboard
webui = ["gradio>=4.0.0"]
# Development tools
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
# Everything except docs/dev/webui/local-model
all = [
    "prometheus-client>=0.20.0",
    "anthropic>=0.30.0",
    "google-genai>=0.3.0",
    "alfworld>=0.4.0",
    "gymnasium>=0.29.0",
]

[project.scripts]
skillopt-train  = "scripts.train:main"
skillopt-eval   = "scripts.eval_only:main"

[project.urls]
Homepage      = "https://github.com/dnzengou/evo-skillopt"
Repository    = "https://github.com/dnzengou/evo-skillopt"
Issues        = "https://github.com/dnzengou/evo-skillopt/issues"
Documentation = "https://github.com/dnzengou/evo-skillopt#readme"

[tool.setuptools.packages.find]
include = ["skillopt*", "scripts*"]

[tool.ruff]
line-length    = 120
target-version = "py310"
extend-exclude = [
    "skillopt/",        # vendored SkillOpt library (MIT upstream)
    "skillopt_webui/",  # vendored Gradio dashboard
    "scripts/train.py",      # vendored SkillOpt entry point
    "scripts/eval_only.py",  # vendored SkillOpt entry point
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
addopts    = "-ra --strict-markers"
testpaths  = ["tests"]
